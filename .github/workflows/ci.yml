name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Backend ----------
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements/dev.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt

      - name: Lint (ruff)
        run: cd backend && ruff check .

      - name: Security scan (bandit)
        run: cd backend && bandit -r apps/ config/ -x tests -q --severity-level medium

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && python -m pytest --tb=short -q

  # ---------- Frontend ----------
  frontend-lint-test:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build
        run: cd frontend && pnpm build

  # ---------- E2E Smoke ----------
  e2e-smoke:
    name: E2E Smoke — docker-compose healthz
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8777/healthz; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        # The compose `frontend` service runs `pnpm install && ng serve` from
        # scratch on a fresh node:20-alpine container, which can take 60–90s
        # before the dev server starts answering on :4444. Mirror the backend
        # retry loop here so the smoke step doesn't race the dev server.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444 -o /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          docker compose logs frontend
          exit 1

      - name: Check frontend
        run: curl -sf http://localhost:4444 | grep -q "StratTraderPro"

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ---------- Legacy IBKR credential guard (M04 §6.9 / AC-04-13) ----------
  # After the Alpaca pivot (ADR-041) the IBKR TWS_* / DEBUG_VNC env vars must
  # not reappear in active code or config. They are allowed ONLY in the parked
  # reference paths (the ib-gateway sidecar, the compose profile, and the
  # historical docs / plans that document the spike).
  block-legacy-ibkr-creds:
    name: Guard — no legacy IBKR creds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grep for TWS_ / DEBUG_VNC outside the allowlist
        run: |
          MATCHES=$(git grep -nE "TWS_|DEBUG_VNC" -- \
            ':!docker/ib-gateway' \
            ':!docker-compose.yml' \
            ':!docs' \
            ':!project-plan' \
            ':!MEMORY.md' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Legacy IBKR credentials (TWS_/DEBUG_VNC) found outside the allowlist:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No legacy IBKR credentials in active code/config."

  # ---------- Image Scan ----------
  image-scan:
    name: Trivy — Docker Image Scan
    runs-on: ubuntu-latest
    needs: [backend-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t stp-backend:ci .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: stp-backend:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
