name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  deploy:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --environment staging

      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --environment staging

      - name: Post-deploy smoke test
        run: |
          STAGING_URL="${{ vars.STAGING_BACKEND_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_BACKEND_URL not set — skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 15); do
            if curl -sf "$STAGING_URL/healthz"; then
              echo "Staging backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Staging smoke test failed"
          exit 1
