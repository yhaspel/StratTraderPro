name: Deploy to Staging

# Disabled 2026-05-20 — Railway is configured to auto-deploy from GitHub
# directly (Service → Source → Branch = main). When this workflow also ran
# on push, both deploys raced and the `railway up` here would overwrite the
# Railway-native GitHub deploy. The CLI path does NOT inject
# RAILWAY_GIT_COMMIT_SHA, so /healthz on staging silently regressed to
# `"version": "unknown"` every time. See docs/runbooks/staging-deploy.md.
#
# Re-enable only if you also (a) disable Railway's built-in GitHub deploy
# for the staging environment, AND (b) make the `railway up` calls below
# pass GIT_SHA as an env var so /healthz keeps reporting the real commit.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  deploy:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --environment staging

      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --environment staging

      - name: Post-deploy smoke test
        run: |
          STAGING_URL="${{ vars.STAGING_BACKEND_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_BACKEND_URL not set — skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 15); do
            if curl -sf "$STAGING_URL/healthz"; then
              echo "Staging backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Staging smoke test failed"
          exit 1
