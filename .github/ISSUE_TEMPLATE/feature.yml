name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["yuval3000"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about.

  - type: dropdown
    id: milestone
    attributes:
      label: Related Milestone
      options:
        - M00 — Scoping & Setup
        - M01 — Auth Foundation
        - M02 — MFA & User Profile
        - M03 — Strategies & Webhook Config
        - M04 — Webhook Ingest & IBKR
        - M05 — TradeStation & Order Lifecycle
        - M06 — Market Data & Regime
        - M07 — Sentiment Pipeline
        - M08 — Risk Engine & Kill Switches
        - M09 — Walk-Forward Backtester
        - M10 — Admin, Audit & Observability
        - M11 — Hardening & Load Test
        - M12 — Beta & Sign-off
