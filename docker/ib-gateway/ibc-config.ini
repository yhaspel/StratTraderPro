# IBC configuration template — M04 Day-1 SPIKE
#
# Rendered by entrypoint.sh: __TWS_USERID__, __TWS_PASSWORD__, __TRADING_MODE__
# are substituted from env at container start.
#
# Reference: https://github.com/IbcAlpha/IBC/blob/master/userguide.md
# Only the keys we actually need are set; everything else takes IBC defaults.

# ===== Login =====
LoginId=__TWS_USERID__
Password=__TWS_PASSWORD__
PasswordEncrypted=no

# paper | live — refused in entrypoint if not "paper" for the spike.
# This setting is the headless equivalent of the Live/Paper toggle on the
# IBKR web login screen. Unified accounts (the modern default, including
# all IBKR Israel / IB Ireland accounts) use a single live username for
# both modes; TradingMode=paper binds the session to the DU... paper
# sub-account. For this to work without manual intervention, 2FA-for-paper
# must be disabled in IBKR Account Management → Secure Login System.
TradingMode=__TRADING_MODE__

# IB Gateway install root. Must match TWS_PATH in the Dockerfile.
IbDir=/root/Jts

# ===== API =====
# 4002 is the paper-mode API port. ib_insync will connect to localhost:4002
# from the smoke test (or from the broker adapter container in compose).
OverrideTwsApiPort=4002

# Allow API connections; they need to be writable for place_order to work.
ReadOnlyApi=no

# Auto-accept the "incoming API connection" dialog that pops up the first
# time a new client connects. Without this, IB Gateway sits modal forever.
AcceptIncomingConnectionAction=accept

# Suppress nagware so the GUI doesn't block the API behind a modal.
AcceptNonBrokerageAccountWarning=accept
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes

# If a session for the same login already exists, take it over (this is what
# we want for a single-user spike; in multi-user M04 we serialize via Redis
# locks per the §6.2 design and this becomes "manual" with retry logic).
ExistingSessionDetectedAction=primary

# ===== Auto-logoff =====
# IB Gateway logs every account out at a configurable daily time (default
# 23:59 server-time) regardless of activity. Set ClosedownAt empty to
# disable the daily logoff so the spike can run overnight without a 2FA
# prompt at re-login. AutoLogoffMinutes=0 disables idle-based logoff too.
ClosedownAt=
AutoLogoffMinutes=0

# Live trading uses IBKR Mobile push for 2FA; paper does not. Leave blank.
SecondFactorDevice=
FIX=no

# ===== Logging =====
# Surface IBC's own log to stdout so `docker logs ib-gateway` shows the
# login flow. Helpful for diagnosing the spike's failure modes.
LogToConsole=yes
