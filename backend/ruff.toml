line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "B", "S"]
ignore = ["S101"]

[lint.per-file-ignores]
# Settings modules use star-imports from base, intentionally bind 0.0.0.0 in dev,
# embed a non-secret test SECRET_KEY, and call `git rev-parse` with a partial path.
"config/settings/*.py" = ["F405", "F403", "S104", "S105", "S607", "E402"]
# Auto-generated Django migrations: line length is not human-controlled.
"**/migrations/*.py" = ["E501"]
# Tests legitimately use hardcoded credentials and small import-shuffles.
"**/tests.py" = ["S105", "S106"]
"**/test_*.py" = ["S105", "S106"]
# M11 load-test tooling (not shipped app code): non-crypto `random` for traffic
# mixing (S311), fixture secrets (S105/S106), and best-effort teardown (S110).
"loadtest/*.py" = ["S311", "S105", "S106", "S110"]
