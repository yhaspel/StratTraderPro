# StratTraderPro alert rules (M10 §6.5g, AC-10-9).
#
# These are the reconciled master-plan §9 rules + the three M09 backtest rules
# + the M10 additions, expressed as PromQL. A pytest cross-check
# (apps/audit ... test_alert_rules) verifies every referenced series against the
# metric names exported by the codebase, so a renamed/removed metric fails CI.
#
# The exact Grafana unified-alerting provisioning payload (uid/condition/data)
# is generated on import; contact points + notification policy live alongside
# (contact-points.yaml, notification-policy.yaml). Importing to Grafana Cloud is
# the [LIVE] operator step in docs/runbooks/alerting-setup.md.
apiVersion: 1
groups:
  - name: trading-ops
    folder: StratTraderPro
    interval: 1m
    rules:
      - alert: WebhookErrorRatioWarn
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
          / sum(rate(django_http_responses_total_by_status_total[5m])) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Webhook 5xx ratio > 1% (5m)"}
      - alert: WebhookErrorRatioCrit
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
          / sum(rate(django_http_responses_total_by_status_total[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Webhook 5xx ratio > 2% (5m)"}
      - alert: BrokerStreamSilent
        expr: max(broker_stream_heartbeat_age_seconds) > 120
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Broker trade-updates stream silent > 2 min"}
      - alert: OrderSubmitLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(order_submit_latency_seconds_bucket[10m])) by (le)) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Order submit p95 > 2s (10m)"}
      - alert: KillSwitchFlattenSlow
        expr: histogram_quantile(0.99, sum(rate(killswitch_flatten_latency_seconds_bucket[10m])) by (le)) > 5
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Kill-switch flatten p99 > 5s (page)"}

  - name: risk-and-queues
    folder: StratTraderPro
    interval: 1m
    rules:
      - alert: CeleryQueueDepthHigh
        expr: max(celery_queue_depth) > 1000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Celery queue depth > 1000"}
      - alert: KillSwitchTriggered
        expr: increase(killswitch_trigger_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "Kill switch triggered"}
      - alert: SentimentLag
        expr: sentiment_queue_oldest_age_minutes > 30
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Sentiment scoring lag > 30 min"}
      - alert: HMMModelStale
        expr: regime_model_age_seconds > 172800
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "HMM model age > 48h (weekend mute documented)"}

  - name: platform-and-audit
    folder: StratTraderPro
    interval: 1m
    rules:
      - alert: AuditIntegrityFailure
        expr: increase(audit_integrity_check_total{result="fail"}[1h]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "Audit-log integrity check FAILED (page — freeze audit trust)"}
      - alert: DBConnectionSaturation
        # Railway managed Postgres does not expose CPU via the exporter; alert on
        # a connection-count saturation proxy. Actual CPU alert = Railway dashboard.
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Postgres connections > 80% of max"}

  - name: backtest-ops
    folder: StratTraderPro
    interval: 1m
    rules:
      - alert: BacktestQueueWaitHigh
        expr: histogram_quantile(0.95, sum(rate(backtest_queue_wait_seconds_bucket[15m])) by (le)) > 600
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Backtest queue wait p95 > 10 min (worker-backtest missing?)"}
      - alert: BacktestFailureRate
        expr: increase(backtest_failed_total[1h]) > 3
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "Backtest failures > 3 in 1h"}
      - alert: BacktestArtifactBloat
        expr: backtest_artifact_bytes > 5e9
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "Backtest artifact storage > 5 GB"}

  # ---------------------------------------------------------------------------
  # BUG-008 — dead-man's switch. DO NOT DELETE.
  #
  # Every other rule in this file is *self-filtering*: the comparison lives inside
  # the PromQL (`... > 0`, `... > 0.8`), so a healthy system returns an EMPTY
  # result. Grafana maps empty -> NoData -> (noDataState=OK) -> Normal. That
  # mapping is correct for those rules — but it means silence is ambiguous:
  #
  #     "no series because the condition is false"   (healthy)
  #     "no series because nothing is being scraped" (BLIND)
  #
  # are indistinguishable. Before these rules existed, killing the agent — or
  # breaking /metrics basic auth, or an exporter dying, or hitting the ingestion
  # cap — would have turned all 17 rules green and paged nobody. For a trading
  # bot, KillSwitchTriggered and AuditIntegrityFailure failing *silently open* is
  # the worst available failure mode.
  #
  # IMPORT SETTINGS — read this before "fixing" them, the intuition is inverted:
  #
  #   MetricsPipelineDown : noDataState=OK, execErrState=Alerting
  #   TargetDown          : noDataState=OK, execErrState=OK
  #
  # It is tempting to give the dead-man's switch noDataState=Alerting — "surely
  # THIS rule should page on NoData". That is backwards, and it was tried:
  # `absent(X)` returns an EMPTY vector exactly when X is present, i.e. when the
  # pipeline is HEALTHY. Grafana reads empty as NoData, so noDataState=Alerting
  # makes the rule fire continuously while everything is fine — which is how it
  # was caught (it went `pending` on its first evaluation with the backend up).
  #
  # Empty therefore has to map to OK. The datasource-unreachable case — the one
  # that actually worried us — surfaces as an *Error*, not NoData, so it is
  # covered by execErrState=Alerting instead.
  # ---------------------------------------------------------------------------
  - name: observability-liveness
    folder: StratTraderPro
    interval: 1m
    rules:
      - alert: MetricsPipelineDown
        # `absent()` returns 1 exactly when the series has no sample. Covers agent
        # death, remote_write failure, and target removal alike: once `up` for the
        # backend goes stale, this fires. 5m > staleness window, so a single missed
        # scrape does not page.
        expr: absent(up{service="backend"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "METRICS PIPELINE DOWN — alerting is BLIND, treat all other rules as unreliable"
          description: >-
            No `up` sample for service=backend. The Grafana Agent is not scraping or
            not remote-writing. Every self-filtering rule (kill switch, audit
            integrity, broker stream) is now returning empty and reporting Normal —
            they are not green, they are blind. Runbook: docs/runbooks/alerting-setup.md
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Scrape target down: {{ $labels.service }} ({{ $labels.job }})"
          description: >-
            The agent reached this target but the scrape failed. Any alert rule that
            depends on this service's metrics is now blind.
