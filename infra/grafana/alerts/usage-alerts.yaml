# Grafana Cloud usage / quota alerts (BUG-005).
#
# !! DIFFERENT DATASOURCE !!
# Every rule in alert-rules.yaml queries `grafanacloud-prom` (our own metrics).
# The rules in THIS file query the `grafanacloud-usage` datasource, which Grafana
# Cloud maintains about our account. Import them against that datasource or they
# will silently return NoData forever.
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# Grafana Cloud does NOT bill raw active series. It bills:
#
#     billable_series = active_series x (actual_DPM / included_DPM)
#
# The free tier includes 1 datapoint-per-minute per series. We were scraping every
# 30s (= 2 DPM), which DOUBLED billable series: 6,946 real series were billed as
# 13,068 against a 10,000 allowance. The account showed "You've reached your free
# tier limit for Metrics" while sitting at 46% of the *enforced* ingestion cap
# (max_active_series_per_user = 15,000) — so the obvious diagnosis ("too many
# series, go delete some metrics") was wrong, and the actual fix was one line:
# scrape_interval 30s -> 60s in infra/grafana-agent/agent.yaml.
#
# The failure mode that makes this worth alerting on: once billable series exceed
# the allowance, Grafana can drop NEW series. A dropped series makes a
# self-filtering rule (see alert-rules.yaml) return empty, which reads as
# "healthy". So a quota problem degrades into blind alerting — quietly.
#
# Alert BEFORE the cliff, not after.
apiVersion: 1
groups:
  - name: grafana-cloud-usage
    folder: StratTraderPro
    interval: 5m
    rules:
      # ---------------------------------------------------------------------
      # DO NOT alert on `grafanacloud_org_metrics_billable_series`.
      #
      # It is a billing-PERIOD AGGREGATE, not a gauge. Measured live: after the
      # scrape interval was halved back to 60s (fixing the overspend), DPM fell
      # 1.98 -> 0.96 and samples/sec fell 228 -> 124 — and billable_series went
      # *UP*, 13,068 -> 13,285. It only accumulates. Alerting on it would page
      # critical every day for the rest of the billing period even though the
      # cause was already fixed, which is how you teach an operator to ignore a
      # pager.
      #
      # These rules instead measure the current billable RATE — the thing we
      # actually control:
      #
      #   samples_per_minute / (included_series x included_DPM)
      #
      # With included_DPM = 1 that is simply samples/min ÷ included_series.
      # Verified: reads 0.746 now (healthy), and 1.372 at the 30s scrape that
      # caused BUG-005 — so it catches the original defect and then goes quiet.
      # ---------------------------------------------------------------------
      - alert: MetricsBudgetHigh
        expr: sum(grafanacloud_instance_samples_per_second) * 60 / scalar(grafanacloud_org_metrics_included_series) > 0.85
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Grafana metrics budget > 85% of the included allowance"
          description: >-
            Current billable rate. If this is climbing, check the SCRAPE INTERVAL
            before deleting metrics — halving the interval doubles this number
            without adding a single series. infra/grafana-agent/agent.yaml must stay
            at scrape_interval: 60s.

      - alert: MetricsBudgetExhausted
        expr: sum(grafanacloud_instance_samples_per_second) * 60 / scalar(grafanacloud_org_metrics_included_series) > 1
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Grafana metrics budget EXCEEDED — new series may be dropped, alerting may go blind"
          description: >-
            Over the included allowance. Grafana Cloud may reject new series. A
            rejected series makes every self-filtering alert rule return empty, which
            Grafana reports as Normal — so alerting degrades to silently-green rather
            than loudly-broken. Fix the scrape rate, don't delete metrics.
            See bugs/BUG-005 and bugs/BUG-008.
