services:
  # ---------- Data stores ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strattraderpro
      POSTGRES_USER: stp_user
      POSTGRES_PASSWORD: stp_local_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stp_user -d strattraderpro"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Backend ----------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8777"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stp_user:stp_local_pw@postgres:5432/strattraderpro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-key-not-for-prod
      SENTRY_DSN: ""
    ports:
      - "8777:8777"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Celery Worker ----------
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A config.celery worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stp_user:stp_local_pw@postgres:5432/strattraderpro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-key-not-for-prod
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Celery Beat ----------
  beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A config.celery beat -l info -S redbeat.RedBeatScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stp_user:stp_local_pw@postgres:5432/strattraderpro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-key-not-for-prod
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  # ---------- Frontend ----------
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm exec ng serve --host 0.0.0.0 --port 4444"
    ports:
      - "4444:4444"
    volumes:
      - ./frontend:/app
      - fe_node_modules:/app/node_modules

  # ---------- ngrok tunnel (optional) ----------
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http backend:8777
    ports:
      - "4040:4040"  # ngrok web UI
    depends_on:
      - backend
    profiles:
      - tunnel  # only starts with: docker compose --profile tunnel up

  # ---------- IB Gateway sidecar (M04 Day-1 SPIKE) ----------
  # Opt-in only: starts with `docker compose --profile ibkr-spike up ib-gateway`.
  # Validates the four assumptions in docs/adr/040-ibkr-gateway-sidecar.md
  # before broker-adapter work compounds on top. Throwaway-or-promote.
  #
  # Required env (put in .env, gitignored):
  #   TWS_USERID=<your IBKR paper username>
  #   TWS_PASSWORD=<your IBKR paper password>
  # Optional:
  #   DEBUG_VNC=1   to expose the Gateway GUI on localhost:5900
  ib-gateway:
    build:
      context: .
      dockerfile: docker/ib-gateway/Dockerfile
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: paper
      # VNC for debug visibility. Set VNC_SERVER_PASSWORD=<anything> in .env
      # to enable; gnzsnz's run.sh only starts x11vnc when this env var is
      # non-empty. Connect via `open vnc://localhost:5900` on macOS using
      # the same password. Leave unset for normal operation — the older
      # DEBUG_VNC compose var was a misnomer (gnzsnz never read it).
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      # gnzsnz contract — without these the API hangs after TCP accept:
      #   TWS_ACCEPT_INCOMING=accept  → auto-confirm the "incoming connection"
      #     dialog Gateway raises on every new client. Default `manual` blocks
      #     the API handshake on a modal IBC won't click → 10s ib_insync TO.
      #   READ_ONLY_API=no            → image default is `yes`; placeOrder
      #     would silently no-op in step 3 of the smoke even after H3 fixed.
      #   BYPASS_WARNING=yes          → suppress the "API precautions" modal
      #     on each connect.
      #   RELOGIN_AFTER_TWOFA_TIMEOUT=yes → 2FA-friendly auto-recovery.
      #   EXISTING_SESSION_DETECTED_ACTION=primary → take over a prior session
      #     instead of waiting on a modal that IBC can't auto-click. Without
      #     this, IBC stalls forever on the "Existing session detected" dialog
      #     — service appears Active but API never goes live (ADR-040 gotcha #6).
      #   TIME_ZONE                    → keeps Gateway clock aligned w/ IBKR;
      #     mismatched clocks have caused order-routing oddities in past.
      TWS_ACCEPT_INCOMING: accept
      READ_ONLY_API: "no"
      BYPASS_WARNING: "yes"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: primary
      TIME_ZONE: ${TIME_ZONE:-Asia/Jerusalem}
    ports:
      # gnzsnz indirection: IB Gateway itself binds 127.0.0.1:4002 (only),
      # and a sidecar `socat` listens on container :4004 forwarding to
      # 127.0.0.1:4002. We must publish host:4002 → container:4004 so
      # external clients pass through socat — connecting straight to
      # container:4002 hits Gateway with the Docker bridge source IP and
      # IB's TrustedIPs=127.0.0.1 silently drops the API handshake.
      - "4002:4004"   # paper API — smoke test connects here
      - "5900:5900"   # VNC, only useful when DEBUG_VNC=1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/127.0.0.1/4004' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    profiles:
      - ibkr-spike

volumes:
  pgdata:
  fe_node_modules:
